components:
  schemas:
    NewVampire:
      type: object
      properties:
        name:
          type: string
        initialDescription:
          type: string
      required:
      - initialDescription
      - name
    Vampire:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        intialDescription:
          type: string
    NewSkill:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    Skill:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        checked:
          type: boolean
        lost:
          type: boolean
    NewResource:
      type: object
      properties:
        name:
          type: string
        stationary:
          type: boolean
      required:
      - name
      - stationary
    Resource:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        stationary:
          type: boolean
        lost:
          type: boolean
    NewPrompt:
      type: object
      properties:
        promptText:
          type: string
      required:
      - promptText
    Prompt:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
    NewDescription:
      type: object
      properties:
        description:
          type: string
      required:
      - description
    NewPerson:
      type: object
      properties:
        name:
          type: string
        initialDescription:
          $ref: "#/components/schemas/NewDescription"
        dead:
          type: boolean
        immortal:
          type: boolean
      required:
      - initialDescription
      - name
    Description:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
    Person:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        dead:
          type: boolean
        immortal:
          type: boolean
        descriptions:
          type: array
          items:
            $ref: "#/components/schemas/Description"
    NewPage:
      type: object
      properties:
        page:
          type: integer
          format: int32
        promptTexts:
          type: array
          items:
            $ref: "#/components/schemas/NewPrompt"
      required:
      - page
      - promptTexts
    Page:
      type: object
      properties:
        id:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/Prompt"
    NewExperience:
      type: object
      properties:
        promptId:
          type: integer
          format: int64
        response:
          type: string
      required:
      - promptId
      - response
    NewMemory:
      type: object
      properties:
        initialExperience:
          $ref: "#/components/schemas/NewExperience"
      required:
      - initialExperience
    Experience:
      type: object
      properties:
        id:
          type: integer
          format: int64
        prompt:
          $ref: "#/components/schemas/Prompt"
        response:
          type: string
    Memory:
      type: object
      properties:
        id:
          type: integer
          format: int64
        remembered:
          type: boolean
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
    NewGame:
      type: object
      properties:
        vampire:
          $ref: "#/components/schemas/NewVampire"
