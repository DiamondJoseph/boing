on:
  workflow_call:
    inputs:
      java_version:
        type: string
        # Current LTS release
        default: "25"
      java_distribution:
        type: string
        default: "temurin"

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7

    - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5

    - run: helm plugin install https://github.com/losisin/helm-values-schema-json.git --version 2.5.0 --verify=false

    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3

  maven_spotless:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
      with:
        java-version: ${{ inputs.java_version }}
        distribution: ${{ inputs.java_distribution }}
        cache: 'maven'

    - run: mvn spotless:check --batch-mode
