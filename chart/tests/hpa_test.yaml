suite: autoscaler
templates:
  - hpa.yaml
release:
  name: test
tests:
  - it: is not created by default
    asserts:
      - hasDocuments:
          count: 0

  - it: scales the deployment on CPU by default
    set:
      autoscaling.enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: test-boing
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 100
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 80

  - it: can scale on memory as well
    set:
      autoscaling.enabled: true
      autoscaling.targetMemoryUtilizationPercentage: 70
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - equal:
          path: spec.metrics[1].resource
          value:
            name: memory
            target:
              type: Utilization
              averageUtilization: 70
