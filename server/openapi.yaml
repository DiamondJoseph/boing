        skills:
          type: array
          items:
            $ref: "#/components/schemas/NewSkill"
      required:
      - people
      - resources
      - skills
      - vampire
    Diary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        lost:
          type: boolean
        memories:
          type: array
          items:
