on:
  release:
    types:
    - created

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  test_java:
    uses: ./.github/workflows/_test_java.yml

  test_client:
    uses: ./.github/workflows/_test_client.yml

  test_chart:
    uses: ./.github/workflows/_test_chart.yml

  publish_jar:
    permissions:
      packages: write
    uses: ./.github/workflows/_jar.yml
    needs:
    - lint
    - test_java
    with:
      publish: true

  publish_container:
    permissions:
      packages: write
    uses: ./.github/workflows/_container.yml
    needs:
    - publish_jar
    - test_client
    with:
      publish: true

  publish_chart:
    permissions:
      packages: write
    uses: ./.github/workflows/_chart.yml
    needs:
    - publish_container
    - test_chart
    with:
      publish: true
