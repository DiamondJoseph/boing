on:
  workflow_call:
    inputs:
      java_version:
        type: string
        # Current LTS release
        default: "25"
      java_distribution:
        type: string
        default: "temurin"

jobs:
  maven_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: ${{ inputs.java_distribution }}
          cache: 'maven'

      - run: mvn verify --batch-mode -Dspotless.check.skip=true
