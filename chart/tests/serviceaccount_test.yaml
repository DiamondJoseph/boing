suite: service account
templates:
  - serviceaccount.yaml
release:
  name: test
tests:
  - it: is created by default and mounts its token
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-boing
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: uses the configured name and annotations
    set:
      serviceAccount.name: vampire
      serviceAccount.automount: false
      serviceAccount.annotations:
        example.com/role: reader
    asserts:
      - equal:
          path: metadata.name
          value: vampire
      - equal:
          path: automountServiceAccountToken
          value: false
      - equal:
          path: metadata.annotations
          value:
            example.com/role: reader

  - it: is not created when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
